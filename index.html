<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gbgl - Gofile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0c111c;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* 本家のスクリーンショットをそのまま正確な土台として使用するコンテナ */
        .gofile-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        /* 本家の画像そのもの */
        .gofile-bg-img {
            width: 100%;
            display: block;
            pointer-events: none;
        }

        /* 上側の画像プレビュー枠に重ねるインタラクティブエリア（IMG_4116 2.JPG のサムネイル部分） */
        .preview-box-1 {
            position: absolute;
            top: 25.4%;
            left: 17.5%;
            width: 67%;
            height: 20.8%;
            cursor: pointer;
        }

        /* 下側の画像プレビュー枠に重ねるインタラクティブエリア（IMG_4116.JPG のサムネイル部分） */
        .preview-box-2 {
            position: absolute;
            top: 55.4%;
            left: 17.5%;
            width: 67%;
            height: 20.8%;
            cursor: pointer;
        }

        /* TikTok風プレイヤー画面 */
        #tiktok-player {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 1000;
            overflow: hidden;
        }
        .tiktok-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        /* 戻るボタン（矢印） */
        .back-gofile-btn {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        /* 上部ヘッダー */
        .tt-top-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px 14px 52px;
            z-index: 3;
            color: rgba(255, 255, 255, 0.75);
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 100%);
        }
        .tt-nav-tabs {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .tt-tab {
            cursor: pointer;
            white-space: nowrap;
        }
        .tt-tab.active {
            color: #fff;
            border-bottom: 2px solid #fff;
            padding-bottom: 2px;
        }
        .tt-live-icon {
            border: 1px solid rgba(255,255,255,0.8);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            color: #fff;
        }

        /* 右側サイドバー */
        .tt-sidebar {
            position: absolute;
            right: 12px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 3;
        }
        .tt-action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .tt-avatar-container {
            position: relative;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .tt-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #fff;
            background-color: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
        .tt-follow-badge {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #fe2c55;
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
        .tt-svg-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5));
        }

        /* 左下情報（秘密の晒し屋） */
        .tt-info-container {
            position: absolute;
            left: 16px;
            bottom: 95px;
            right: 80px;
            z-index: 3;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            cursor: pointer;
        }
        .tt-username {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .tt-caption {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .tt-sound {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.9;
        }

        /* プレイヤーコントロールバー */
        .tt-player-controls {
            position: absolute;
            bottom: 65px;
            left: 0;
            width: 100%;
            padding: 0 16px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .play-pause-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .seekbar {
            flex-grow: 1;
            height: 3px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .seekbar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
        }
        .time-display {
            font-size: 11px;
            color: #fff;
            min-width: 65px;
            text-align: right;
        }

        /* 下部ナビゲーションバー */
        .tt-bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 3;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .tt-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8c8c8c;
            font-size: 10px;
            cursor: pointer;
        }
        .tt-nav-item.active {
            color: #fff;
            font-weight: bold;
        }
        .tt-nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
        .tt-center-btn {
            width: 44px;
            height: 28px;
            background: linear-gradient(to right, #25f4ee, #fe2c55);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* モーダルポップアップ */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background-color: #ffffff;
            color: #000000;
            width: 85%;
            max-width: 340px;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .modal-icon {
            width: 60px;
            height: 60px;
            background-color: #fe2c55;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
        }
        .modal-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }
        .modal-btn {
            background-color: #fe2c55;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- 本家のスクリーンショットを完コピの土台として使用 -->
    <div class="gofile-container">
        <!-- アップロードした画像ファイル -->
        <img src="photo_2026-10-11_04-21-11.jpg" alt="Gofile" class="gofile-bg-img" id="base-bg">

        <!-- 1つ目の動画プレビューエリア（クリックでプレイヤー起動） -->
        <div class="preview-box-1" onclick="openTikTokPlayer('001（z106）.MP4')"></div>

        <!-- 2つ目の動画プレビューエリア（クリックでプレイヤー起動） -->
        <div class="preview-box-2" onclick="openTikTokPlayer('001（z106）.MP4')"></div>
    </div>

    <!-- TikTok風プレイヤー画面 -->
    <div id="tiktok-player">
        <video id="active-video" class="tiktok-video" playsinline webkit-playsinline x5-playsinline preload="auto" loop></video>
        
        <button class="back-gofile-btn" onclick="closeTikTokPlayer()">＜</button>

        <div class="tt-top-header" onclick="showModal()">
            <div class="tt-live-icon">LIVE</div>
            <div class="tt-nav-tabs">
                <span class="tt-tab">シリーズ</span>
                <span class="tt-tab">フォロー中</span>
                <span class="tt-tab">ショップ</span>
                <span class="tt-tab active">おすすめ</span>
            </div>
            <span style="font-size: 20px;">🔍</span>
        </div>

        <div class="tt-info-container" onclick="showModal()">
            <div class="tt-username">秘密の晒し屋</div>
            <div class="tt-caption">限定公開動画コンテンツ #おすすめ</div>
            <div class="tt-sound">🎵 オリジナル楽曲 - 秘密の晒し屋</div>
        </div>

        <div class="tt-sidebar">
            <div class="tt-avatar-container" onclick="showModal()">
                <div class="tt-avatar">晒</div>
                <div class="tt-follow-badge">+</div>
            </div>
            
            <div class="tt-action-item" onclick="showModal()">
                <div class="tt-svg-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </div>
                <span>159</span>
            </div>

            <div class="tt-action-item" onclick="showModal()">
                <div class="tt-svg-icon">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="#ffffff"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
                </div>
                <span>11</span>
            </div>

            <div class="tt-action-item" onclick="showModal()">
                <div class="tt-svg-icon">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                </div>
                <span>12</span>
            </div>

            <div class="tt-action-item" onclick="showModal()">
                <div class="tt-svg-icon">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                </div>
                <span>シェア</span>
            </div>

            <div class="tt-action-item" onclick="showModal()">
                <div style="width: 34px; height: 34px; background: #222; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 10px;">🎵</div>
            </div>
        </div>

        <div class="tt-player-controls">
            <button id="play-pause-icon" class="play-pause-btn" onclick="togglePlayPause()">⏸️</button>
            <input type="range" id="video-seekbar" class="seekbar" value="0" min="0" max="100" step="0.1">
            <span id="time-text" class="time-display">0:00 / 0:00</span>
        </div>

        <div class="tt-bottom-nav">
            <div class="tt-nav-item active" onclick="showModal()">
                <span class="tt-nav-icon">🏠</span>
                <span>ホーム</span>
            </div>
            <div class="tt-nav-item" onclick="showModal()">
                <span class="tt-nav-icon" style="position:relative;">👥<span style="position:absolute; top:-4px; right:-8px; background:#fe2c55; color:#fff; font-size:9px; padding:1px 4px; border-radius:10px;">1</span></span>
                <span>友達</span>
            </div>
            <div class="tt-center-btn" onclick="showModal()">+</div>
            <div class="tt-nav-item" onclick="showModal()">
                <span class="tt-nav-icon" style="position:relative;">💬<span style="position:absolute; top:-4px; right:-8px; background:#fe2c55; color:#fe2c55; font-size:9px; padding:1px 4px; border-radius:10px;">2</span></span>
                <span>メッセージ</span>
            </div>
            <div class="tt-nav-item" onclick="showModal()">
                <span class="tt-nav-icon">👤</span>
                <span>プロフィール</span>
            </div>
        </div>
    </div>

    <!-- ストア誘導ポップアップ -->
    <div id="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">📱</div>
            <div class="modal-title">ようこそゲストさん。</div>
            <div class="modal-desc">アプリがインストールされていません。<br>インストールをしてからお楽しみください。</div>
            <button class="modal-btn" onclick="redirectToStore()">ストアでインストールする</button>
        </div>
    </div>

    <script>
        const targetUrl = "https://lite.tiktok.com/t/ZS9D3Lpd4mv1v-mFlcJ/";
        const activeVideo = document.getElementById('active-video');
        const seekbar = document.getElementById('video-seekbar');
        const timeText = document.getElementById('time-text');
        const playPauseBtn = document.getElementById('play-pause-icon');

        function openTikTokPlayer(videoUrl) {
            const player = document.getElementById('tiktok-player');
            activeVideo.src = videoUrl;
            player.style.display = 'block';
            activeVideo.load();
            activeVideo.play().catch(e => {
                console.log("再生制限:", e);
            });
            playPauseBtn.textContent = "⏸️";
        }

        function closeTikTokPlayer() {
            const player = document.getElementById('tiktok-player');
            player.style.display = 'none';
            activeVideo.pause();
            activeVideo.src = "";
        }

        function togglePlayPause() {
            if (activeVideo.paused) {
                activeVideo.play();
                playPauseBtn.textContent = "⏸️";
            } else {
                activeVideo.pause();
                playPauseBtn.textContent = "▶️";
            }
        }

        activeVideo.addEventListener('timeupdate', () => {
            if (!isNaN(activeVideo.duration)) {
                const progress = (activeVideo.currentTime / activeVideo.duration) * 100;
                seekbar.value = progress;
                timeText.textContent = formatTime(activeVideo.currentTime) + " / " + formatTime(activeVideo.duration);
            }
        });

        seekbar.addEventListener('input', () => {
            if (!isNaN(activeVideo.duration)) {
                const time = (seekbar.value / 100) * activeVideo.duration;
                activeVideo.currentTime = time;
            }
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        function showModal() {
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function redirectToStore() {
            window.location.href = targetUrl;
        }

        activeVideo.addEventListener('ended', function() {
            showModal();
        });
    </script>

</body>
</html>
