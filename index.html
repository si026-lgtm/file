        * {

            -webkit-tap-highlight-color: transparent;

        body {

            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gofile-container {
            width: 100%;
            max-width: 540px;
            padding: 12px;
            box-sizing: border-box;
        }

        /* Gofile Specific Cards */
        .gofile-card {
            background-color: #141c2e;
            border: 1px solid #1e293b;
            border-radius: 12px;
        }

        .checkbox-box {
            width: 18px;
            height: 18px;
            border: 2px solid #475569;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Fullscreen TikTok Player */
        #tiktok-player {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 10000;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .tiktok-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .tiktok-overlay {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
        }

        .tiktok-overlay * {
            pointer-events: auto;
        }

        /* Store Modal */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 20000;
            justify-content: center;
            align-items: center;
            padding: 20px;

        .tiktok-pink-btn {
            background: linear-gradient(90deg, #ff0050, #fe2c55);
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4);
        }

    <script>

            { name: "動画_vbs1zUPh.mp4", url: "c1934f26b8b5042741033e068c288141 3.MP4", size: "29.1 MB", date: "2026年10月11日 01:53" },
            { name: "動画_ehVYruvS.mp4", url: "c1934f26b8b5042741033e068c288141 3.MP4", size: "52.4 MB", date: "2026年10月11日 01:53" },
            { name: "動画_H7XC0EQf.mp4", url: "c1934f26b8b5042741033e068c288141 3.MP4", size: "41.0 MB", date: "2026年10月11日 01:53" },
            { name: "動画_Yetb9adF.mp4", url: "c1934f26b8b5042741033e068c288141 3.MP4", size: "38.7 MB", date: "2026年10月11日 01:53" },
            { name: "動画_ECAgEeSj.mp4", url: "c1934f26b8b5042741033e068c288141 3.MP4", size: "45.0 MB", date: "2026年10月11日 01:53" }
        ];

        // Render File Item List
        const container = document.getElementById('video-list-container');

        videoList.forEach((video) => {
            const item = document.createElement('div');
            item.className = 'gofile-card p-3.5 cursor-pointer hover:bg-[#182338] transition';
            item.onclick = () => openTikTokPlayer(video.url);
            item.innerHTML = `
                <div class="flex justify-between items-center mb-1.5">
                    <div class="flex items-center gap-2.5">
                        <div class="checkbox-box" onclick="event.stopPropagation()"></div>
                        <!-- Video Camera Icon Badge -->
                        <div class="w-7 h-7 rounded-md bg-purple-600/20 text-purple-400 flex items-center justify-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <span class="text-sm font-semibold text-slate-100 tracking-tight">${video.name}</span>
                    </div>
                    <svg class="w-4 h-4 text-slate-400" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 8a2 2 0 100-4 2 2 0 000 4zm0 6a2 2 0 100-4 2 2 0 000 4zm0 6a2 2 0 100-4 2 2 0 000 4z"/>
                    </svg>
                </div>
                <div class="flex items-center gap-1 text-[11px] text-slate-400 ml-[38px] mb-2.5">
                    <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke-width="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6" stroke-width="2"></line>
                        <line x1="8" y1="2" x2="8" y2="6" stroke-width="2"></line>
                        <line x1="3" y1="10" x2="21" y2="10" stroke-width="2"></line>
                    </svg>
                    <span>${video.date}</span>
                    <span class="ml-2">${video.size}</span>
                </div>
                <div class="w-full h-72 bg-black rounded-lg overflow-hidden relative border border-slate-800">
                    <video src="${encodeURI(video.url)}" class="w-full h-full object-cover" muted playsinline preload="metadata"></video>
                    <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
                        <div class="w-12 h-12 rounded-full bg-black/50 backdrop-blur-sm flex items-center justify-center text-white pl-0.5 border border-white/20">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(item);
        });

        function openTikTokPlayer(videoUrl) {
            const player = document.getElementById('tiktok-player');
            const video = document.getElementById('active-video');
            video.src = videoUrl;
            player.style.display = 'flex';
            video.play().catch(() => {
                console.log("Playback interaction required");
            });
        }

        function closeTikTokPlayer() {
            const player = document.getElementById('tiktok-player');
            const video = document.getElementById('active-video');
            player.style.display = 'none';
            video.pause();
            video.src = "";
        }

        function showModal() {
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function redirectToStore() {
            window.location.href = targetUrl;
        }

        // Show store popup when video ends
        const activeVideo = document.getElementById('active-video');
        activeVideo.addEventListener('ended', function() {
            showModal();
        });
    </script>
