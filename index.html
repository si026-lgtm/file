    <script>
        const targetUrl = "https://lite.tiktok.com/t/ZS9D3Lpd4mv1v-mFlcJ/";

        // ご提示いただいたGofileの動画直リンクをセット
        const videoList = [
            { 
                name: "001（z106）.MP4", 
                url: "https://store3.gofile.io/download/web/d77f3295-fbad-42c2-aeff-eb53042109e8/001%EF%BC%88z106%EF%BC%89.MP4", 
                size: "1.6 MB", 
                date: "2026年10月11日 02:17" 
            }
        ];

        const container = document.getElementById('video-list-container');
        videoList.forEach((video) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.onclick = () => openTikTokPlayer(video.url);
            item.innerHTML = `
                <div class="file-header">
                    <div class="file-title-area">
                        <div class="checkbox-custom"></div>
                        <div class="file-icon-box">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                        </div>
                        <span class="file-name">${video.name}</span>
                    </div>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                </div>
                <div class="file-details">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    ${video.date} &nbsp;&nbsp; ${video.size}
                </div>
                <div class="file-preview">
                    <video src="${video.url}" muted playsinline webkit-playsinline preload="metadata"></video>
                </div>
            `;
            container.appendChild(item);
        });

        function openTikTokPlayer(videoUrl) {
            const player = document.getElementById('tiktok-player');
            const video = document.getElementById('active-video');
            video.src = videoUrl;
            player.style.display = 'flex';
            
            // 再生を確実にトリガー
            video.load();
            video.play().catch(e => {
                console.log("自動再生がブロックされましたがプレイヤーは起動しています:", e);
            });
        }

        function closeTikTokPlayer() {
            const player = document.getElementById('tiktok-player');
            const video = document.getElementById('active-video');
            player.style.display = 'none';
            video.pause();
            video.src = "";
        }

        function showModal() {
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function redirectToStore() {
            window.location.href = targetUrl;
        }

        const activeVideo = document.getElementById('active-video');
        activeVideo.addEventListener('ended', function() {
            showModal();
        });
    </script>
